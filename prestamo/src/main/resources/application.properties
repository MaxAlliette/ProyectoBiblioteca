spring.application.name=PRESTAMOS
server.port = 8094

spring.datasource.url=jdbc:mysql://localhost:3306/db_bibliotecaproyecto
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

ms.usuarios.url=http://localhost:8090/api/v1/usuarios
ms.stocks.url=http://localhost:8085/api/v1/stocks

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true