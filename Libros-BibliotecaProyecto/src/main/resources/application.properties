spring.application.name=LIBROS
server.port = 8082

spring.datasource.url=jdbc:mysql://localhost:3306/db_bibliotecaproyecto
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
ms.autores.url=http://localhost:8081/api/v1/autores
ms.categorias.url=http://localhost:8083/api/v1/categorias

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true